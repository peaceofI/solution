<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a2d">
<title>GrammarNest — Learn English Grammar</title>
<style>
:root{
  --bg:#061321;--panel:rgba(13,31,49,.72);--text:#eef9ff;--muted:#a8c4d4;
  --accent:#38d5ff;--accent2:#7c5cff;--line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(56,213,255,.16),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(124,92,255,.18),transparent 30%),
    linear-gradient(145deg,#040b14,#071a2d 55%,#08111f);
  overflow-x:hidden;
}
body:before,body:after{
  content:"";position:fixed;width:260px;height:260px;border-radius:50%;
  filter:blur(70px);opacity:.18;pointer-events:none;z-index:-1;
}
body:before{background:#20d9ff;top:15%;left:-120px}
body:after{background:#845bff;right:-120px;bottom:10%}
.container{width:min(1120px,92%);margin:auto}
header{text-align:center;padding:55px 0 32px}
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:8px 13px;
  border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);
  color:#bceeff;font-size:13px;margin-bottom:16px;backdrop-filter:blur(12px)
}
h1{font-size:clamp(34px,7vw,68px);line-height:1.02;letter-spacing:-2px}
.gradient{background:linear-gradient(90deg,#fff,var(--accent),#a58cff);
-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{max-width:700px;margin:16px auto 0;color:var(--muted);line-height:1.7;font-size:16px}
.toolbar{
 display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:28px 0 34px
}
.search{
 width:min(440px,100%);padding:14px 17px;border:1px solid var(--line);
 border-radius:15px;background:rgba(255,255,255,.07);color:white;outline:none;
 font-size:15px;backdrop-filter:blur(12px)
}
.search:focus{border-color:rgba(56,213,255,.7);box-shadow:0 0 0 3px rgba(56,213,255,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;padding-bottom:40px}
.card{
 position:relative;padding:24px;border:1px solid var(--line);border-radius:24px;
 background:var(--panel);backdrop-filter:blur(18px);overflow:hidden;
 box-shadow:0 18px 55px rgba(0,0,0,.25);transition:.3s transform,.3s border-color,.3s box-shadow
}
.card:before{
 content:"";position:absolute;width:130px;height:130px;border-radius:50%;
 background:var(--accent);filter:blur(60px);opacity:.08;right:-50px;top:-50px
}
.card:hover{transform:translateY(-7px);border-color:rgba(56,213,255,.35);box-shadow:0 25px 65px rgba(0,0,0,.36)}
.icon{
 width:50px;height:50px;border-radius:15px;display:grid;place-items:center;
 background:linear-gradient(135deg,rgba(56,213,255,.18),rgba(124,92,255,.18));
 border:1px solid var(--line);font-size:24px;margin-bottom:18px
}
.card h2{font-size:21px;margin-bottom:9px}
.card p{color:var(--muted);line-height:1.65;min-height:78px}
.learn{
 width:100%;margin-top:18px;padding:13px 15px;border:0;border-radius:14px;
 color:#04101b;background:linear-gradient(100deg,#42ddff,#7f7cff);
 font-weight:800;cursor:pointer;transition:.2s
}
.learn:hover{filter:brightness(1.08);transform:scale(1.015)}
.learn:active{transform:scale(.98)}
.no-results{text-align:center;color:var(--muted);padding:30px;display:none}
footer{text-align:center;color:#7695a8;padding:10px 0 35px;font-size:13px}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;
 padding:20px;z-index:10;backdrop-filter:blur(7px)
}
.modal.show{display:grid}
.modal-box{
 width:min(620px,100%);background:#0a1c2d;border:1px solid var(--line);
 border-radius:25px;padding:25px;box-shadow:0 30px 100px rgba(0,0,0,.55)
}
.modal-top{display:flex;justify-content:space-between;gap:15px;align-items:center}
.close{
 border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;
 width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px
}
.modal-box p{color:var(--muted);line-height:1.7;margin:15px 0}
.open{
 display:inline-block;text-decoration:none;background:linear-gradient(100deg,#42ddff,#7f7cff);
 color:#04101b;font-weight:800;padding:12px 18px;border-radius:13px
}
@media(max-width:600px){
 header{padding-top:38px}.card{padding:20px}.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="badge">✦ বাংলা + English • Grammar Learning Hub</div>
  <h1>Master <span class="gradient">English Grammar</span></h1>
  <p class="subtitle">
    Tenses থেকে Right Form of Verbs—গুরুত্বপূর্ণ Grammar topics সহজ বাংলা ব্যাখ্যা ও
    YouTube lessons-এর মাধ্যমে শিখুন।
  </p>
</header>

<div class="toolbar">
  <input id="search" class="search" type="search" placeholder="🔎 Search grammar topic...">
</div>

<main id="grid" class="grid"></main>
<div id="empty" class="no-results">কোনো topic পাওয়া যায়নি। অন্য কিছু search করুন।</div>

<footer>Learn • Practice • Improve ✨</footer>
</div>

<div id="modal" class="modal" aria-hidden="true">
 <div class="modal-box">
  <div class="modal-top">
   <h2 id="modalTitle"></h2>
   <button id="close" class="close" aria-label="Close">×</button>
  </div>
  <p id="modalText"></p>
  <a id="openLink" class="open" href="#" target="_blank" rel="noopener">▶ Open YouTube</a>
 </div>
</div>

<script>
const lessons=[
 {icon:"⏳",title:"Tenses",text:"Present, Past ও Future Tense-এর structure, rules এবং examples বাংলা ব্যাখ্যায় শিখুন।",q:"English Tense Bangla grammar"},
 {icon:"🔤",title:"Types of Verbs",text:"Main, Helping, Auxiliary, Transitive, Intransitive, Regular ও Irregular Verbs সম্পর্কে জানুন।",q:"Types of Verbs English Grammar Bangla"},
 {icon:"🔄",title:"Changing Sentence",text:"Affirmative, Negative, Interrogative, Exclamatory এবং sentence transformation শিখুন।",q:"Transformation of Sentences Bangla English Grammar"},
 {icon:"📝",title:"Articles",text:"A, An এবং The-এর rules, ব্যবহার ও common mistakes সহজভাবে শিখুন।",q:"Articles A An The English Grammar Bangla"},
 {icon:"🧩",title:"Parts of Speech",text:"Noun, Pronoun, Adjective, Verb, Adverb, Preposition, Conjunction ও Interjection শিখুন।",q:"Parts of Speech English Grammar Bangla"},
 {icon:"✅",title:"Right Form of Verbs",text:"Tense ও Subject-Verb Agreement অনুযায়ী verb-এর সঠিক form ব্যবহার করা শিখুন।",q:"Right Form of Verbs Bangla English Grammar"}
];

const grid=document.getElementById("grid"),search=document.getElementById("search");
const modal=document.getElementById("modal"),modalTitle=document.getElementById("modalTitle");
const modalText=document.getElementById("modalText"),openLink=document.getElementById("openLink");

function yt(query){return "https://www.youtube.com/results?search_query="+encodeURIComponent(query)}
function render(list){
 grid.innerHTML=list.map((x,i)=>`
 <article class="card">
   <div class="icon">${x.icon}</div>
   <h2>${x.title}</h2>
   <p>${x.text}</p>
   <button class="learn" data-id="${i}">▶ Learn on YouTube</button>
 </article>`).join("");
 document.getElementById("empty").style.display=list.length?"none":"block";
 grid.querySelectorAll(".learn").forEach(btn=>{
   btn.addEventListener("click",()=>{
     const x=list[Number(btn.dataset.id)];
     modalTitle.textContent=x.title;
     modalText.textContent="এই topic-এর বাংলা + English lesson YouTube-এ দেখতে নিচের button চাপুন।";
     openLink.href=yt(x.q);
     modal.classList.add("show");
     modal.setAttribute("aria-hidden","false");
   });
 });
}
render(lessons);

search.addEventListener("input",e=>{
 const term=e.target.value.trim().toLowerCase();
 render(lessons.filter(x=>(x.title+" "+x.text).toLowerCase().includes(term)));
});

function closeModal(){
 modal.classList.remove("show");
 modal.setAttribute("aria-hidden","true");
}
document.getElementById("close").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
</script>
</body>
</html>
