<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نور المعرفة | Noor Al-Marifah</title>
<meta name="description" content="An educational and Islamic learning website for English, Mathematics, Poems, Novels, Q&A and thoughts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --sky:#35baf6; --sky2:#0b8fd0; --sky3:#bfeeff;
  --navy:#07304a; --ink:#0d2535; --muted:#587080;
  --bg:#eaf8ff; --panel:rgba(255,255,255,.68);
  --panel2:rgba(255,255,255,.88); --border:rgba(255,255,255,.72);
  --shadow:0 18px 50px rgba(10,91,135,.15);
  --danger:#ef5350; --gold:#e7b84b;
}

body.dark{
  --bg:#061722; --panel:rgba(9,34,48,.70); --panel2:rgba(8,27,39,.92);
  --ink:#e8f7ff; --muted:#a9c5d2; --border:rgba(145,220,255,.14);
  --shadow:0 20px 55px rgba(0,0,0,.38);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:"Noto Sans Bengali",system-ui,sans-serif;
  color:var(--ink);
  background:
  radial-gradient(circle at 10% 10%,rgba(53,186,246,.20),transparent 28%),
  radial-gradient(circle at 90% 30%,rgba(108,220,255,.18),transparent 25%),
  linear-gradient(135deg,var(--bg),#f7fdff);
  min-height:100vh;
  overflow-x:hidden;
  transition:.35s ease;
}

body.dark{
  background:
  radial-gradient(circle at 10% 10%,rgba(53,186,246,.10),transparent 28%),
  linear-gradient(135deg,#061722,#0a2330)
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background-image:
    linear-gradient(rgba(53,186,246,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(53,186,246,.045) 1px,transparent 1px);
  background-size:38px 38px;
}

a{color:inherit}
button,input,textarea,select{font:inherit}

.hero{
  min-height:270px;
  padding:42px 18px 35px;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(120deg,rgba(3,47,71,.92),rgba(8,133,191,.78)),
    url("https://raw.githubusercontent.com/BetimShala/quran-images-api/master/quran-images/1.png") center/cover;
  color:white;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 75% 25%,rgba(255,255,255,.28),transparent 18%),
    linear-gradient(transparent 60%,rgba(0,20,32,.35));
  pointer-events:none;
}

.hero-inner{
  max-width:1180px;
  margin:auto;
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:24px;
  align-items:center
}

.brand h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(2rem,5vw,4.2rem);
  letter-spacing:.5px
}

.brand .bn{
  font-size:clamp(1.05rem,2vw,1.4rem);
  opacity:.92;
  margin-top:6px
}

.brand p{
  margin-top:12px;
  max-width:700px;
  opacity:.82;
  line-height:1.8
}

.hero-card{
  justify-self:end;
  width:min(100%,340px);
  padding:22px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.13);
  backdrop-filter:blur(16px);
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.18)
}

.hero-card .big{font-size:3rem}
.hero-card strong{display:block;font-size:1.1rem;margin-top:8px}
.hero-card span{opacity:.76;font-size:.86rem}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  padding:10px 12px;
  background:rgba(240,250,255,.78);
  backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--border);
  box-shadow:0 8px 28px rgba(10,90,130,.08)
}

body.dark .topbar{
  background:rgba(5,22,32,.78)
}

.nav-btn,.tool-btn{
  border:1px solid rgba(53,186,246,.22);
  background:var(--panel);
  color:var(--ink);
  cursor:pointer;
  border-radius:16px;
  padding:10px 13px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:.25s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 5px 18px rgba(0,100,150,.06);
  position:relative;
  overflow:hidden
}

.nav-btn:hover,
.nav-btn.active,
.tool-btn:hover{
  transform:translateY(-2px);
  background:linear-gradient(135deg,var(--sky),var(--sky2));
  color:white;
  box-shadow:0 10px 26px rgba(11,143,208,.25)
}

.nav-num{
  font-size:.68rem;
  opacity:.65;
  background:rgba(255,255,255,.45);
  padding:2px 6px;
  border-radius:99px
}

.nav-btn.active .nav-num,
.nav-btn:hover .nav-num{
  opacity:1;
  background:rgba(255,255,255,.2)
}

.nav-icon{font-size:1rem}
#customNav{display:contents}

.tools{
  max-width:1180px;
  margin:20px auto 0;
  padding:0 16px;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.search{
  flex:1;
  min-width:220px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 15px;
  border-radius:18px;
  background:var(--panel);
  border:1px solid var(--border);
  backdrop-filter:blur(15px);
  box-shadow:var(--shadow)
}

.search input{
  border:0;
  outline:0;
  background:transparent;
  color:var(--ink);
  width:100%
}

.tool-btn{white-space:nowrap}

main{
  max-width:1180px;
  margin:22px auto 70px;
  padding:0 16px
}

.section{
  display:none;
  animation:rise .45s ease both
}

.section.active{display:block}

@keyframes rise{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin:25px 0 18px
}

.section-head h2{
  font-size:clamp(1.4rem,3vw,2rem)
}

.section-head p{
  color:var(--muted);
  font-size:.88rem
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:17px
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  backdrop-filter:blur(18px) saturate(140%);
  border-radius:24px;
  padding:20px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
  transition:.3s ease
}

.card:before{
  content:"";
  position:absolute;
  inset:0 auto auto 0;
  width:100%;
  height:3px;
  background:linear-gradient(90deg,var(--sky),#8ce8ff,var(--gold));
  opacity:.75
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 24px 55px rgba(0,110,170,.18)
}

.card .serial{
  display:inline-flex;
  padding:4px 9px;
  border-radius:99px;
  background:rgba(53,186,246,.10);
  color:var(--sky2);
  font-size:.72rem;
  font-weight:800;
  margin-bottom:12px
}

.card h3{
  font-size:1.12rem;
  margin-bottom:8px
}

.card h3 a{text-decoration:none}
.card h3 a:hover{color:var(--sky2)}

.card p{
  color:var(--muted);
  line-height:1.75;
  font-size:.9rem
}

.card img{
  width:100%;
  max-height:190px;
  object-fit:cover;
  border-radius:16px;
  margin:-2px 0 14px;
  border:1px solid var(--border)
}

.socials{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px
}

.socials a{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(53,186,246,.1);
  text-decoration:none;
  color:var(--sky2);
  transition:.2s
}

.socials a:hover{
  background:var(--sky2);
  color:#fff;
  transform:translateY(-2px)
}

.delete{
  position:absolute;
  right:12px;
  top:12px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  background:rgba(239,83,80,.10);
  color:var(--danger);
  display:none
}

.admin-on .delete{
  display:grid;
  place-items:center
}

.about-card{
  max-width:800px;
  margin:auto
}

.notice{
  padding:14px 16px;
  border-radius:18px;
  background:rgba(53,186,246,.09);
  border:1px solid rgba(53,186,246,.16);
  color:var(--muted);
  line-height:1.7
}

footer{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  border-top:1px solid var(--border)
}

.admin-dot{
  position:fixed;
  right:12px;
  bottom:12px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#8fdfff;
  box-shadow:
    0 0 0 5px rgba(143,223,255,.10),
    0 0 18px rgba(53,186,246,.45);
  cursor:pointer;
  z-index:5000
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,20,30,.58);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:9000
}

.modal.open{display:flex}

.modal-box{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:28px;
  padding:24px;
  box-shadow:0 35px 90px rgba(0,0,0,.3);
  animation:pop .25s ease
}

@keyframes pop{
  from{opacity:0;transform:scale(.96) translateY(10px)}
  to{opacity:1;transform:none}
}

.modal-box h3{margin-bottom:16px}

.close{
  float:right;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:1.2rem;
  cursor:pointer
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px
}

.tab{
  border:0;
  padding:9px 12px;
  border-radius:12px;
  background:rgba(53,186,246,.08);
  color:var(--ink);
  cursor:pointer
}

.tab.active{
  background:var(--sky2);
  color:#fff
}

.panel{display:none}
.panel.active{display:block}

label{
  display:block;
  font-size:.82rem;
  font-weight:700;
  margin:12px 0 5px;
  color:var(--muted)
}

input,textarea,select{
  width:100%;
  border:1px solid rgba(53,186,246,.2);
  border-radius:13px;
  padding:11px 12px;
  outline:none;
  background:rgba(255,255,255,.52);
  color:#173241
}

body.dark input,
body.dark textarea,
body.dark select{
  background:rgba(255,255,255,.05);
  color:var(--ink)
}

textarea{
  min-height:120px;
  resize:vertical
}

.primary,.danger{
  border:0;
  border-radius:13px;
  padding:11px 15px;
  margin-top:14px;
  cursor:pointer;
  font-weight:800
}

.primary{
  background:linear-gradient(135deg,var(--sky),var(--sky2));
  color:white
}

.danger{
  background:var(--danger);
  color:white
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
  border-radius:13px;
  background:rgba(53,186,246,.06);
  margin:7px 0
}

.list-item span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.small-actions{
  display:flex;
  gap:6px
}

.small-actions button{
  border:0;
  border-radius:9px;
  padding:7px 9px;
  cursor:pointer
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:#07304a;
  color:#fff;
  padding:11px 17px;
  border-radius:13px;
  z-index:99999;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  animation:toast .25s ease
}

@keyframes toast{
  from{opacity:0;transform:translate(-50%,10px)}
  to{opacity:1;transform:translate(-50%,0)}
}

.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.35);
  transform:scale(0);
  animation:ripple .55s linear;
  pointer-events:none
}

@keyframes ripple{
  to{transform:scale(4);opacity:0}
}

@media(max-width:800px){
  .hero-inner{grid-template-columns:1fr}
  .hero-card{justify-self:stretch}
  .topbar{
    justify-content:flex-start;
    overflow:auto;
    flex-wrap:nowrap
  }
  .nav-btn{flex:0 0 auto}
  .nav-btn .nav-label{display:inline}
  .grid{grid-template-columns:1fr 1fr}
}

@media(max-width:560px){
  .hero{min-height:310px}
  .grid{grid-template-columns:1fr}
  .tools{margin-top:12px}
  .nav-btn{padding:9px 10px}
  .nav-num{display:none}
  .nav-label{font-size:.78rem}
}

.creation-strip{
  position:relative;
  min-height:190px;
  overflow:hidden;
  background:
    linear-gradient(90deg,rgba(2,35,49,.72),rgba(0,125,172,.24)),
    url("https://raw.githubusercontent.com/BetimShala/quran-images-api/master/quran-images/1.png") center/cover no-repeat;
  border-bottom:1px solid rgba(255,255,255,.35)
}

.creation-strip:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 15% 35%,rgba(255,255,255,.28),transparent 18%),
    linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,20,30,.38));
}

.creation-overlay{
  position:relative;
  z-index:1;
  max-width:1180px;
  margin:auto;
  padding:34px 18px;
  color:white
}

.creation-copy{
  max-width:690px;
  padding:20px 24px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  border-radius:24px;
  box-shadow:0 15px 45px rgba(0,0,0,.16)
}

.creation-kicker{
  font-weight:800;
  color:#d8f7ff
}

.creation-copy h2{
  font-family:"Playfair Display",serif;
  font-size:clamp(1.45rem,3vw,2.4rem);
  margin:5px 0
}

.creation-copy p{
  opacity:.9;
  line-height:1.75;
  font-size:.9rem
}

.flash-modal-body{
  line-height:1.9;
  color:var(--ink)
}

.flash-modal-body img{
  width:100%;
  max-height:330px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:15px
}

.flash-modal-body .flash-link{
  display:inline-flex;
  margin-top:16px;
  padding:9px 13px;
  border-radius:12px;
  background:var(--sky2);
  color:#fff;
  text-decoration:none
}

.flash-socials{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap
}

.flash-socials a{
  padding:8px 11px;
  border-radius:11px;
  background:rgba(53,186,246,.10);
  color:var(--sky2);
  text-decoration:none
}

.admin-only-note{
  font-size:.78rem;
  color:var(--muted);
  margin-top:8px
}

/* Cross-device compatibility */
html,body{
  width:100%;
  max-width:100%
}

img,video,iframe{
  max-width:100%
}

button,a,input,textarea,select{
  touch-action:manipulation
}

.nav-btn,.tool-btn,.tab,.primary,.danger{
  min-height:44px
}

.card{
  min-width:0;
  overflow-wrap:anywhere
}

.card h3,.card p{
  overflow-wrap:anywhere;
  word-break:break-word
}

.hero,.topbar,main,footer{
  max-width:100vw
}

@media (min-width:769px) and (max-width:1100px){
  .hero-inner{grid-template-columns:1fr .55fr}
  .topbar{
    justify-content:flex-start;
    overflow-x:auto;
    flex-wrap:nowrap
  }
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}

@media(max-width:768px){
  .hero{
    padding:30px 14px 26px;
    min-height:0
  }

  .hero-inner{
    grid-template-columns:1fr;
    gap:16px
  }

  .hero-card{width:100%}

  .topbar{
    justify-content:flex-start;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:8px 10px
  }

  .topbar::-webkit-scrollbar{display:none}
  .nav-btn{flex:0 0 auto}
  .tools{padding:0 12px}
  main{padding:0 12px}

  .section-head{
    align-items:flex-start;
    flex-direction:column
  }

  .modal{padding:10px}

  .modal-box{
    max-height:94vh;
    border-radius:22px;
    padding:18px
  }
}

@media(max-width:480px){
  .hero-card{
    padding:17px;
    border-radius:20px
  }

  .tools{
    display:grid;
    grid-template-columns:1fr 1fr
  }

  .search{
    grid-column:1/-1;
    min-width:0
  }

  .tool-btn{
    width:100%;
    justify-content:center
  }

  .grid{
    grid-template-columns:1fr;
    gap:13px
  }

  .card{
    border-radius:20px;
    padding:17px
  }

  .admin-dot{
    right:9px;
    bottom:9px
  }
}

@media(hover:none){
  .card:hover,.nav-btn:hover,.tool-btn:hover{
    transform:none
  }

  .card:active{
    transform:scale(.99)
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important
  }
}

#manageList{
  max-height:58vh;
  overflow-y:auto;
  padding-right:4px
}
</style>
</head>
<body>
